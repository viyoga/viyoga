<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="darkreader-lock">
  <script>(function(){
    var root = document.documentElement;
    var params = null;
    try { params = new URLSearchParams(window.location.search); } catch (e) {}
    var get = function (key) { return params ? params.get(key) : null; };
    var themes = ['amber', 'zeel', 'safelight', 'tungsten', 'ocean', 'nyctophobia', 'toxic'];
    window.__THEMES__ = themes;
    var theme = get('theme');
    if (!theme) { try { theme = localStorage.getItem('theme'); } catch (e) {} }
    if (theme === 'mallow') theme = 'zeel';
    if (themes.indexOf(theme) < 0) theme = 'safelight';
    root.setAttribute('data-theme', theme);
    var fonts = ['maple', 'iosevka', 'space'];
    var font = get('font');
    if (!font) { try { font = localStorage.getItem('font'); } catch (e) {} }
    if (fonts.indexOf(font) < 0) font = 'iosevka';
    root.setAttribute('data-font', font);
    var files = {
      maple: ['MapleMono-NF-Regular.woff2', 'MapleMono-NF-Bold.woff2'],
      iosevka: ['Iosevka-Regular.woff2', 'Iosevka-Bold.woff2'],
      space: ['SpaceMono-Regular.woff2', 'SpaceMono-Bold.woff2']
    }[font];
    for (var i = 0; i < files.length; i++) {
      var link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'font';
      link.type = 'font/woff2';
      link.crossOrigin = 'anonymous';
      link.href = '/fonts/' + files[i];
      document.head.appendChild(link);
    }
    root.classList.add('js');
  })();
  window.__themeSwap = function (apply) {
    var reduced = false;
    try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (!reduced && document.startViewTransition) {
      try {
        document.startViewTransition(apply);
        return;
      } catch (e) {}
    }
    apply();
  };</script>
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.css?v=20261128d">
  <script>(function(){
    var root = document.documentElement;
    try {
      if (!localStorage.getItem('viyoga-intro-seen') &&
          (location.pathname === '/' || location.pathname === '/index.html') &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches &&
          !/[?&]nointro(?:[=&]|$)/.test(location.search)) {
        root.classList.add('intro-pending');
        try { localStorage.setItem('viyoga-intro-seen', '1'); } catch (e) {}
        setTimeout(function(){ root.classList.remove('intro-pending'); }, 3200);
      }
    } catch (e) {}
  })();</script>
  <link id="redesign-css" rel="stylesheet" href="/redesign.css?v=20261128d" disabled>
  <script>(function(){
    var root = document.documentElement;
    var params = null;
    try { params = new URLSearchParams(window.location.search); } catch (e) {}
    var qd = params ? params.get('design') : null;
    var design = (qd === 'new' || qd === 'classic') ? qd : null;
    if (design) {
      try { localStorage.setItem('design', design); } catch (e) {}
    } else {
      try { design = localStorage.getItem('design'); } catch (e) {}
    }
    if (design !== 'new') design = 'classic';
    root.setAttribute('data-design', design);

    var sheet = document.getElementById('redesign-css');
    if (sheet) {
      var on = design === 'new';
      if (on) sheet.removeAttribute('disabled');
      else sheet.setAttribute('disabled', '');
      sheet.disabled = !on;
    }
    if (design !== 'new') return;

    // Separate the redesign's theme/font prefs from the classic keys.
    try {
      var real = window.localStorage;
      var map = function (k) {
        return (k === 'theme' || k === 'font') ? 'v0-' + k : k;
      };
      var wrap = new Proxy(real, {
        get: function (t, p) {
          if (p === 'getItem') return function (k) { return t.getItem(map(k)); };
          if (p === 'setItem') return function (k, v) { return t.setItem(map(k), v); };
          if (p === 'removeItem') return function (k) { return t.removeItem(map(k)); };
          if (p === 'clear') return function () { return t.clear(); };
          if (p === 'key') return function (i) { return t.key(i); };
          if (p === 'length') return t.length;
          if (typeof p === 'string' && (p === 'theme' || p === 'font')) {
            return t.getItem(map(p));
          }
          return t[p];
        },
        set: function (t, p, v) {
          if (typeof p === 'string' && (p === 'theme' || p === 'font')) {
            t.setItem(map(p), v);
            return true;
          }
          t[p] = v;
          return true;
        }
      });
      Object.defineProperty(window, 'localStorage', {
        configurable: true,
        get: function () { return wrap; }
      });
    } catch (e) {}

    var themes = ['amber', 'zeel', 'safelight', 'tungsten', 'toxic'];
    window.__THEMES__ = themes;
    var theme = params ? params.get('theme') : null;
    var tmap = {
      caelus: 'amber',
      'catppuccin-mocha': 'zeel',
      dracula: 'safelight',
      'gruvbox-material': 'safelight',
      gruvbox: 'safelight',
      rebellion: 'tungsten',
      amber: 'amber',
      mallow: 'zeel',
      zeel: 'zeel',
      safelight: 'safelight',
      tungsten: 'tungsten',
      nyctophobia: 'safelight'
    };
    if (!theme) { try { theme = localStorage.getItem('theme'); } catch (e) {} }
    if (theme && tmap[theme]) theme = tmap[theme];
    if (themes.indexOf(theme) < 0) theme = 'amber';
    root.setAttribute('data-theme', theme);
    try { localStorage.setItem('theme', theme); } catch (e) {}

    var fonts = ['maple', 'iosevka', 'space'];
    var font = params ? params.get('font') : null;
    var fmap = {
      annotation: 'maple',
      'annotation-mono': 'maple',
      maple: 'maple',
      iosevka: 'iosevka',
      nunito: 'space',
      space: 'space'
    };
    if (!font) { try { font = localStorage.getItem('font'); } catch (e) {} }
    if (font && fmap[font]) font = fmap[font];
    if (fonts.indexOf(font) < 0) font = 'iosevka';
    root.setAttribute('data-font', font);
    try { localStorage.setItem('font', font); } catch (e) {}
  })();</script>

</div>

    <button class="theme-btn" id="design-btn" type="button" aria-label="Switch to new design" title="Switch to new design" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18M9 9v11"/></svg></button>
  </div>
  <div class="theme-pick">
    <button class="theme-btn" id="font-btn" type="button" aria-label="Font" title="Font"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
  </div>
  <div class="theme-pick">
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Theme" title="Theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button>
  </div>
</nav>

{% block content %}{% endblock content %}

<script>(function(){
  var root = document.documentElement;
  var intro = document.getElementById('intro');
  if (!intro || !root.classList.contains('intro-pending')) return;
  var done = false;
  function end() {
    if (done) return;
    done = true;
    root.classList.add('intro-leaving');
    try { localStorage.setItem('viyoga-intro-seen', '1'); } catch (e) {}
    setTimeout(function(){
      root.classList.remove('intro-pending', 'intro-leaving');
      if (intro.parentNode) intro.parentNode.removeChild(intro);
    }, 400);
  }
  setTimeout(end, 1750);
  intro.addEventListener('pointerdown', end, { once: true });
  window.addEventListener('keydown', end, { once: true });
})();</script>
